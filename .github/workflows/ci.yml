
name: DevOps CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          grep -q '<title>' index.html
          grep -q 'FA23-BAI-045' index.html

      - name: Check CSS file
        run: |
          test -f style.css
          grep -q 'body' style.css

      - name: Check Labs section
        run: |
          grep -q 'My DevOps Labs' index.html
          grep -q 'GitHub Actions' index.html

      - name: Build Docker image
        run: docker build -t devops-a2:test .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ujalaadil1554/devops-a2:latest
